<?xml version="1.0" encoding="UTF-8"?>
<!--
  Marca de Hermes (spec 001, RF-51 y RF-52; docs/design.md, «Logo e iconos»).
  Fuente vectorial: no se sirve. De aquí salen, rasterizados en el navegador con un <canvas>:
  - hermes/assets/logo.webp (1254×1254): este dibujo tal cual, disco con la marca y
    transparente fuera del disco.
  - hermes/assets/icon-192.png e icon-512.png: la misma marca (#marca) sobre un cuadrado a sangre
    del tono de marca (E5) en lugar del disco: <rect width="100" height="100" fill="#1F7E90"/>.
  Monograma «H» de trazo grueso (17 de 100, más de 1/6 del lado) con el travesaño en diagonal
  ascendente: el mensaje que sale. Ocupa el 60 % central (de 20 a 80), así no lo cortan las
  esquinas redondeadas de iOS. Colores fuera de los tokens CSS: #1F7E90 (E6) y #F4F6F6.
  La cabecera de la página usa la misma marca en SVG en línea (.brand-mark, hermes/status.py).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 100 100">
  <defs>
    <g id="marca" fill="#F4F6F6">
      <rect x="20" y="22" width="17" height="56" rx="2.5"/>
      <rect x="63" y="22" width="17" height="56" rx="2.5"/>
      <polygon points="28,48.4 72,34.9 72,52.6 28,66.1"/>
    </g>
  </defs>
  <circle id="fondo" cx="50" cy="50" r="50" fill="#1F7E90"/>
  <use href="#marca"/>
</svg>
